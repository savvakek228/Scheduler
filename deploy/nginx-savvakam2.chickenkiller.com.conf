# Scheduler reverse proxy for savvakam2.chickenkiller.com.
#
# Notes:
# - Content-Type is forwarded explicitly: `proxy_pass_request_headers off`
#   strips it otherwise, breaking POST /api/tasks with HTTP 415.
# - Upgrade/Connection headers enable WebSockets (Blazor Server / SignalR).
# - location /hooks/gitops serves the GitOps webhook (see deploy/gitops-install.sh).
# - After issuing a certificate with `certbot --nginx -d savvakam2.chickenkiller.com`
#   certbot adds a TLS server block and an HTTP -> HTTPS redirect to this file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name savvakam2.chickenkiller.com;

    location /hooks/gitops {
        proxy_pass http://127.0.0.1:9000/hooks/scheduler-gitops;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_set_header X-GitHub-Delivery $http_x_github_delivery;
        proxy_set_header Content-Type $content_type;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_pass_request_headers off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Content-Type $content_type;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
